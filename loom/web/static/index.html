<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loom</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f1117; color: #e2e8f0; line-height: 1.5; }
  #app { max-width: 1200px; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; color: #f8fafc; }
  #status { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1rem; }

  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 1rem; }
  @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1rem; }
  .panel h2 { font-size: 1rem; color: #cbd5e1; margin-bottom: 0.75rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }

  /* Instance list */
  .instance-item { padding: 0.5rem 0; border-bottom: 1px solid #1a2332; }
  .instance-item:last-child { border-bottom: none; }
  .instance-title { font-weight: 600; font-size: 0.9rem; color: #e2e8f0; }
  .instance-meta { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.25rem; font-size: 0.8rem; }

  /* Badges */
  .badge { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
  .badge-success { background: #065f46; color: #6ee7b7; }
  .badge-running  { background: #1e3a5f; color: #93c5fd; }
  .badge-pending  { background: #4b3b00; color: #fcd34d; }
  .badge-failed   { background: #7f1d1d; color: #fca5a5; }
  .badge-blocked  { background: #4a1d5f; color: #d8b4fe; }
  .badge-default  { background: #334155; color: #94a3b8; }

  .cost { color: #94a3b8; font-variant-numeric: tabular-nums; }
  .cost-over-budget { color: #f87171; font-weight: 700; }

  /* Graph panel */
  .instance-group { margin-bottom: 1rem; }
  .instance-group h3 { font-size: 0.9rem; color: #93c5fd; margin-bottom: 0.5rem; }
  .node { display: inline-flex; align-items: center; padding: 0.3rem 0.6rem; margin: 0.2rem; border-radius: 6px; background: #334155; font-size: 0.8rem; border: 1px solid #475569; }
  .node-kind { color: #a78bfa; margin-right: 0.4rem; font-size: 0.7rem; text-transform: uppercase; }
  .edge-list { font-size: 0.75rem; color: #64748b; margin-top: 0.4rem; }
  .edge-list span { display: inline-block; margin-right: 0.6rem; }
  .arrow { color: #64748b; }

  .error-msg { background: #7f1d1d; color: #fca5a5; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; }
  .empty-msg { color: #64748b; font-style: italic; padding: 1rem 0; }

  /* Gate panel */
  .gate-item { padding: 0.5rem 0; border-bottom: 1px solid #1a2332; }
  .gate-item:last-child { border-bottom: none; }
  .gate-title { font-weight: 600; font-size: 0.9rem; color: #fcd34d; }
  .gate-meta { font-size: 0.8rem; color: #94a3b8; margin-top: 0.25rem; }
  .gate-actions { margin-top: 0.5rem; display: flex; gap: 0.5rem; }
  .gate-btn { padding: 0.3rem 0.8rem; border: none; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-weight: 600; }
  .gate-btn-approve { background: #065f46; color: #6ee7b7; }
  .gate-btn-approve:hover { background: #047857; }
  .gate-btn-reject { background: #7f1d1d; color: #fca5a5; }
  .gate-btn-reject:hover { background: #991b1b; }

  /* Cytoscape DAG */
  #cytoscape-container canvas { outline: none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.3/dist/cytoscape.min.js"></script>
</head>
<body>
<div id="app">
  <h1>Loom</h1>
  <div id="status">Loading...</div>

  <div class="layout">
    <div id="instances" class="panel">
      <h2>Instances</h2>
    </div>
    <div id="gates" class="panel">
      <h2>Pending Gates</h2>
    </div>
  </div>
  <div id="graph" class="panel" style="margin-top: 1rem;">
    <h2>Graph</h2>
    <div id="cytoscape-container" style="width: 100%; height: 500px; background: #0f1117; border-radius: 8px; position: relative;"></div>
    <div id="node-detail" style="display: none; margin-top: 1rem; padding: 1rem; background: #1e293b; border-radius: 8px;">
      <h3 style="margin: 0 0 0.5rem 0;">Node Detail</h3>
      <div id="node-detail-content"></div>
      <button id="node-detail-close" style="margin-top: 0.5rem; padding: 0.25rem 0.75rem; background: #334155; color: #e2e8f0; border: none; border-radius: 4px; cursor: pointer;">Close</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // Red-highlight instances with cost_usd >= 5 (over-budget threshold)
  var OVER_BUDGET_THRESHOLD = 5;

  var statusEl  = document.getElementById("status");
  var instPanel = document.getElementById("instances");
  var gatesPanel = document.getElementById("gates");
  var graphPanel = document.getElementById("graph");

  // --- Fetch helpers -----------------------------------------------------------

  function fetchJSON(url) {
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  function showError(msg) {
    var div = document.createElement("div");
    div.className = "error-msg";
    div.textContent = msg;
    statusEl.parentNode.insertBefore(div, statusEl.nextSibling);
  }

  // --- Render: instances panel --------------------------------------------------

  function statusBadge(status) {
    var cls = "badge-default";
    var s = (status || "").toLowerCase();
    if (s === "success" || s === "completed") cls = "badge-success";
    else if (s === "running")  cls = "badge-running";
    else if (s === "pending")  cls = "badge-pending";
    else if (s === "failed")   cls = "badge-failed";
    else if (s === "blocked")  cls = "badge-blocked";
    var span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = status;
    return span;
  }

  function renderInstances(instances) {
    // Keep the h2
    var h2 = instPanel.querySelector("h2");

    if (!instances.length) {
      instPanel.innerHTML = "";
      instPanel.appendChild(h2);
      var empty = document.createElement("div");
      empty.className = "empty-msg";
      empty.textContent = "No instances found.";
      instPanel.appendChild(empty);
      return;
    }

    instPanel.innerHTML = "";
    instPanel.appendChild(h2);

    instances.forEach(function (inst) {
      var item = document.createElement("div");
      item.className = "instance-item";

      var title = document.createElement("div");
      title.className = "instance-title";
      title.textContent = inst.title || inst.id;
      item.appendChild(title);

      var meta = document.createElement("div");
      meta.className = "instance-meta";
      meta.appendChild(statusBadge(inst.status));

      var cost = document.createElement("span");
      var usd = inst.cost_usd || 0;
      cost.className = "cost" + (usd >= OVER_BUDGET_THRESHOLD ? " cost-over-budget" : "");
      cost.textContent = "$" + usd.toFixed(4);
      meta.appendChild(cost);

      item.appendChild(meta);
      instPanel.appendChild(item);
    });
  }

  // --- Render: gates panel ------------------------------------------------------

  function renderGates(gates) {
    var h2 = gatesPanel.querySelector("h2");
    gatesPanel.innerHTML = "";
    gatesPanel.appendChild(h2);

    if (!gates.length) {
      var empty = document.createElement("div");
      empty.className = "empty-msg";
      empty.textContent = "No pending gates.";
      gatesPanel.appendChild(empty);
      return;
    }

    gates.forEach(function (gate) {
      var item = document.createElement("div");
      item.className = "gate-item";

      var title = document.createElement("div");
      title.className = "gate-title";
      title.textContent = gate.title || gate.id;
      item.appendChild(title);

      var meta = document.createElement("div");
      meta.className = "gate-meta";
      meta.textContent = "Instance: " + (gate.instance_id || "?") + " | Kind: " + (gate.kind || "?");
      item.appendChild(meta);

      var actions = document.createElement("div");
      actions.className = "gate-actions";

      var approveBtn = document.createElement("button");
      approveBtn.className = "gate-btn gate-btn-approve";
      approveBtn.textContent = "Approve";
      approveBtn.onclick = function () { approveGate(gate.id); };
      actions.appendChild(approveBtn);

      var rejectBtn = document.createElement("button");
      rejectBtn.className = "gate-btn gate-btn-reject";
      rejectBtn.textContent = "Reject";
      rejectBtn.onclick = function () { rejectGate(gate.id); };
      actions.appendChild(rejectBtn);

      item.appendChild(actions);
      gatesPanel.appendChild(item);
    });
  }

  function approveGate(nodeId) {
    fetch("/api/gates/" + nodeId + "/approve", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({reason: "Approved via UI"})
    }).then(function (res) {
      if (res.ok) {
        statusEl.textContent = "Gate approved: " + nodeId;
        refreshData();
      } else {
        showError("Failed to approve gate");
      }
    });
  }

  function rejectGate(nodeId) {
    var reason = prompt("Rejection reason:");
    if (reason === null) return; // cancelled
    fetch("/api/gates/" + nodeId + "/reject", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({reason: reason})
    }).then(function (res) {
      if (res.ok) {
        statusEl.textContent = "Gate rejected: " + nodeId;
        refreshData();
      } else {
        showError("Failed to reject gate");
      }
    });
  }

  function refreshData() {
    return Promise.all([
      fetchJSON("/api/instances"),
      fetchJSON("/api/gates"),
      fetchJSON("/api/graph")
    ]).then(function (results) {
      var instances = results[0];
      var gates = results[1];
      var graphData = results[2];
      renderInstances(instances);
      renderGates(gates);
      renderGraph(graphData);
      statusEl.textContent = "Loaded " + instances.length + " instance" +
        (instances.length === 1 ? "" : "s") + ", " + gates.length + " pending gate" +
        (gates.length === 1 ? "" : "s");
      return results;
    }).catch(function (err) {
      statusEl.textContent = "Error loading data";
      showError("Failed to load data: " + err.message);
    });
  }

  // --- Render: graph panel ------------------------------------------------------

  var cy = null;

  function statusToColor(status) {
    var map = {
      "pending": "#94a3b8",
      "running": "#3b82f6",
      "succeeded": "#22c55e",
      "failed": "#ef4444",
      "waiting_gate": "#eab308",
      "blocked": "#f97316",
      "cancelled": "#6b7280"
    };
    return map[status] || "#94a3b8";
  }

  function tierToBorder(tier) {
    var map = {
      "critical": "3px solid #ef4444",
      "heavy": "3px solid #f97316",
      "tooling": "2px solid #64748b",
      "bulk": "2px solid #3b82f6"
    };
    return map[tier] || "2px solid #64748b";
  }

  function buildCytoscapeElements(graphData) {
    var elements = [];
    var instances = graphData.instances || [];
    var nodes = graphData.nodes || [];
    var edges = graphData.edges || [];

    instances.forEach(function (inst) {
      elements.push({
        data: { id: inst.id, name: inst.title || inst.id, isInstance: true },
        classes: "instance-group"
      });
    });

    nodes.forEach(function (n) {
      elements.push({
        data: {
          id: n.id,
          parent: n.instance_id,
          name: n.title || n.id,
          kind: n.kind || "?",
          status: n.status || "pending",
          tier: n.tier || "tooling",
          gate: n.gate || "none",
          spec: n.spec || "",
          budget_tokens: n.budget_tokens || 0,
          bgColor: statusToColor(n.status)
        }
      });
    });

    edges.forEach(function (e) {
      elements.push({
        data: {
          id: e.from_node + "->" + e.to_node,
          source: e.from_node,
          target: e.to_node,
          type: e.type || "depends"
        }
      });
    });

    return elements;
  }

  function showNodeDetail(nodeData) {
    var detail = document.getElementById("node-detail");
    var content = document.getElementById("node-detail-content");
    if (!detail || !content || !nodeData) return;

    var html = "<table style='width:100%; border-collapse:collapse;'>";
    var fields = ["id", "name", "kind", "status", "tier", "gate", "spec", "budget_tokens"];
    fields.forEach(function (f) {
      var val = nodeData[f];
      if (val !== undefined && val !== null && val !== "") {
        html += "<tr><td style='padding:4px 8px; color:#94a3b8; white-space:nowrap;'>" +
          escHtml(f) + "</td><td style='padding:4px 8px; color:#e2e8f0;'>" +
          escHtml(String(val)) + "</td></tr>";
      }
    });
    html += "</table>";
    content.innerHTML = html;
    detail.style.display = "block";
  }

  function initCytoscape(graphData) {
    var container = document.getElementById("cytoscape-container");
    if (!container || typeof cytoscape === "undefined") return;

    var elements = buildCytoscapeElements(graphData);

    if (cy) { cy.destroy(); cy = null; }

    cy = cytoscape({
      container: container,
      elements: elements,
      style: [
        {
          selector: "node.instance-group",
          style: {
            "label": "data(name)",
            "background-color": "#1e293b",
            "border-color": "#475569",
            "border-width": 2,
            "text-valign": "top",
            "font-size": 14,
            "color": "#e2e8f0",
            "padding": 20
          }
        },
        {
          selector: "node[?isInstance]",
          style: {
            "label": "data(name)",
            "background-color": "#1e293b",
            "border-color": "#475569",
            "border-width": 2,
            "text-valign": "top",
            "font-size": 14,
            "color": "#e2e8f0",
            "padding": 20
          }
        },
        {
          selector: "node[^isInstance]",
          style: {
            "label": "data(name)",
            "background-color": "data(bgColor)",
            "color": "#fff",
            "text-valign": "center",
            "text-halign": "center",
            "font-size": 11,
            "width": 60,
            "height": 30,
            "shape": "roundrectangle",
            "border-width": 2,
            "border-color": "#475569"
          }
        },
        {
          selector: "edge",
          style: {
            "width": 2,
            "line-color": "#64748b",
            "target-arrow-color": "#64748b",
            "target-arrow-shape": "triangle",
            "curve-style": "bezier"
          }
        }
      ],
      layout: {
        name: "cose",
        animate: false,
        padding: 30,
        nodeRepulsion: 400000,
        idealEdgeLength: 100,
        edgeElasticity: 100
      }
    });

    cy.on("tap", "node[^isInstance]", function (evt) {
      showNodeDetail(evt.target.data());
    });

    var closeBtn = document.getElementById("node-detail-close");
    if (closeBtn) {
      closeBtn.onclick = function () {
        document.getElementById("node-detail").style.display = "none";
      };
    }
  }

  function renderGraph(graphData) {
    var h2 = graphPanel.querySelector("h2");
    graphPanel.innerHTML = "";
    graphPanel.appendChild(h2);

    var container = document.createElement("div");
    container.id = "cytoscape-container";
    container.style.cssText = "width: 100%; height: 500px; background: #0f1117; border-radius: 8px; position: relative;";
    graphPanel.appendChild(container);

    var detail = document.createElement("div");
    detail.id = "node-detail";
    detail.style.cssText = "display: none; margin-top: 1rem; padding: 1rem; background: #1e293b; border-radius: 8px;";
    detail.innerHTML = '<h3 style="margin: 0 0 0.5rem 0;">Node Detail</h3><div id="node-detail-content"></div>' +
      '<button id="node-detail-close" style="margin-top: 0.5rem; padding: 0.25rem 0.75rem; background: #334155; color: #e2e8f0; border: none; border-radius: 4px; cursor: pointer;">Close</button>';
    graphPanel.appendChild(detail);

    var instances = graphData.instances || [];
    var nodes = graphData.nodes || [];
    if (!instances.length && !nodes.length) {
      var empty = document.createElement("div");
      empty.className = "empty-msg";
      empty.textContent = "No graph data.";
      graphPanel.appendChild(empty);
      return;
    }

    initCytoscape(graphData);
  }

  function shortId(id) {
    return (id && id.length > 8) ? id.slice(0, 8) + "…" : id;
  }

  function escHtml(str) {
    var d = document.createElement("span");
    d.textContent = str;
    return d.innerHTML;
  }

  // --- SSE live updates (P5-B) ------------------------------------------------

  var _sseTimer = null;
  function scheduleRefresh() {
    // debounce: coalesce bursts of events into one refresh at most every 2s
    if (_sseTimer) return;
    _sseTimer = setTimeout(function () {
      _sseTimer = null;
      refreshData();
    }, 2000);
  }

  function connectSSE() {
    if (typeof EventSource === "undefined") return;
    var es = new EventSource("/api/events/stream");
    es.onmessage = function () { scheduleRefresh(); };
    es.onerror = function () {
      // EventSource auto-reconnects; just surface status
      statusEl.textContent = "Live updates reconnecting...";
    };
  }

  // --- Init ---------------------------------------------------------------------

  refreshData();
  connectSSE();
})();
</script>
</body>
</html>

id: content-collect-process
version: 1
trigger: [cron, cli]
provenance: manual
description: |
  内容采集+加工流水线（每日自动运行）
  从 Vault 技术长文 + 平台热点 → 素材提炼 → 内容分析 → 大纲生成
  产出写入 Vault 的 _素材/ _热点/ _合并/ _分析/ _大纲/ 目录

params:
  # Vault 根路径
  vault_path:
    type: string
    required: true
    default: "D:/Vaults/neal"

  # 项目/素材来源目录（扫描技术长文）
  source_dirs:
    type: string
    required: true
    default: "04-项目"

  # 自媒体目录
  content_base:
    type: string
    required: true
    default: "09-自媒体"

  # 目标平台（支持多平台同时采集热点）
  platforms:
    type: string
    required: true
    default: "xiaohongshu,zhihu,gongzhonghao"
    description: "逗号分隔：xiaohongshu / zhihu / gongzhonghao / toutiao"

nodes:
  # ============================================================
  # Node 1: 扫描 Vault 中的技术长文
  # ============================================================
  - id: scan-vault
    kind: analysis
    tier: heavy
    spec: |
      你是素材采集 agent。
      工作目录：{{vault_path}}

      任务：扫描 Vault 中的技术长文/深度分析文章，提取可用素材。

      步骤：
      1. 扫描 {{source_dirs}}/ 目录下最近的 .md 文件（按修改时间排序，取最近 7 天的）
      2. 重点关注以下类型的文章：
         - 开源项目深度分析
         - 技术架构解读
         - 工具评测/对比
         - 实战教程
      3. 对每篇文章提取：
         - 核心观点（3-5 个）
         - 关键数据点（代码行数、性能数据、对比数据）
         - 金句摘录（适合社交传播的精炼表达）
         - 架构图/流程图的文字描述
         - 实战价值点（读者能学到什么、能用什么）
         - 目标受众画像

      输出：为每篇文章生成一个素材文件
      写入目录：{{vault_path}}/{{content_base}}/_素材/
      文件名格式：{YYYYMMDD}-{HHmmss}-{主题关键词}-素材.md

      素材文件结构：
      ```markdown
      ---
      source: {原始文件路径}
      collected_at: {timestamp}
      platforms: [{platforms}]
      ---

      # 素材：{文章标题}
      > 来源：{原始文件路径}
      > 采集时间：{timestamp}

      ## 一句话摘要
      {一句话概括这篇文章的核心价值}

      ## 核心观点
      1. ...
      2. ...
      3. ...

      ## 数据亮点
      - ...

      ## 金句摘录
      > "..."

      ## 架构图描述
      {用文字描述文章中的关键架构/流程}

      ## 实战价值
      - 读者能学到：...
      - 可以做什么：...

      ## 平台适配建议
      ### 小红书
      - 切入角度：...
      ### 知乎
      - 切入角度：...
      ### 公众号
      - 切入角度：...
      ```

    depends_on: []

  # ============================================================
  # Node 2: 扫描各平台热点
  # ============================================================
  - id: scan-trending
    kind: analysis
    tier: heavy
    spec: |
      你是平台热点扫描 agent。

      目标平台：{{platforms}}

      任务：扫描各平台的热门话题（AI/开发者工具/编程/开源方向）。

      对每个平台分别扫描：

      ### 小红书
      - 搜索关键词：AI工具、程序员、开源、AI Agent、Claude、Codex、Cursor
      - 记录 Top-10 热门笔记的标题、话题标签、内容方向、互动数据
      - 分析标题格式和内容风格特征

      ### 知乎
      - 搜索热榜/推荐中的 AI/编程/开源 相关话题
      - 记录高赞回答的切入角度
      - 分析知乎用户偏好的内容深度和格式

      ### 公众号
      - 搜索 AI/开发者工具领域的热门公众号最新文章
      - 记录 10w+ 文章的标题和内容方向
      - 分析公众号的阅读习惯（长文 vs 短文、配图风格）

      输出：每个平台一个热点文件
      写入目录：{{vault_path}}/{{content_base}}/_热点/
      文件名格式：{YYYYMMDD}-{platform}-热点.md

      热点文件结构：
      ```markdown
      ---
      platform: {platform}
      scanned_at: {timestamp}
      ---

      # {平台名} 热点扫描 - {date}

      ## Top-10 热门内容
      1. [标题] - 互动数据
         - 话题/标签：...
         - 内容方向：...
         - 切入角度分析：...

      ## 热门话题标签
      #标签1 #标签2 ...

      ## 内容特征分析
      - 标题格式偏好：...
      - 内容深度：...
      - 配图风格：...
      - 用户互动特征：...
      ```

    depends_on: []

  # ============================================================
  # Node 3: 合并素材+热点
  # ============================================================
  - id: merge-materials
    kind: analysis
    tier: tooling
    spec: |
      合并今日采集的素材和热点数据。

      输入：
      - {{vault_path}}/{{content_base}}/_素材/ 目录下今日所有素材文件
      - {{vault_path}}/{{content_base}}/_热点/ 目录下今日所有热点文件
      - 各平台的合规规则文件（如果存在）

      任务：
      1. 将每篇素材与各平台热点关联：
         - 这篇技术文章可以蹭哪些热点话题？
         - 哪些热点可以用这篇文章的素材来覆盖？
      2. 标注平台合规注意事项：
         - 小红书：必须人工发布、标 AI 辅助、避免模板化
         - 知乎：注意学术严谨性、引用来源
         - 公众号：原创声明、避免洗稿嫌疑
      3. 为每个"素材×平台"组合生成一个关联条目

      输出：合并素材文件
      写入：{{vault_path}}/{{content_base}}/_合并/{YYYYMMDD}-合并素材.md

      结构：
      ```markdown
      ---
      date: {date}
      sources: [{素材文件列表}]
      trending: [{热点文件列表}]
      ---

      # 每日合并素材 - {date}

      ## 素材 × 平台 关联矩阵
      | 素材 | 小红书切入点 | 知乎切入点 | 公众号切入点 |
      |------|-------------|-----------|-------------|
      | codex-深度分析 | 技术揭秘向 | 深度架构分析 | 行业趋势解读 |

      ## 合规提醒
      ### 小红书
      - ...
      ### 知乎
      - ...
      ### 公众号
      - ...

      ## 今日推荐优先级
      1. {素材A} → {平台X} — 理由：...
      2. ...
      ```

    depends_on: [scan-vault, scan-trending]

  # ============================================================
  # Node 4: 内容分析（提炼角度）
  # ============================================================
  - id: analyze-materials
    kind: analysis
    tier: heavy
    spec: |
      你是内容策划 agent。

      输入：{{vault_path}}/{{content_base}}/_合并/{今日合并素材}

      任务：从素材中提炼各平台可用的内容角度。

      对每个"素材×平台"组合，分析可行的内容角度：

      ### 小红书角度库
      1. **技术揭秘向**：揭开 XX 的黑盒 / XX 是怎么做到的
      2. **对比测评向**：XX vs YY，哪个更好用
      3. **实战教程向**：手把手教你用 XX 做 YY
      4. **行业观察向**：XX 的架构设计给我们什么启示
      5. **趣味科普向**：XX 的冷知识 / 你不知道的 XX

      ### 知乎角度库
      1. **深度解析向**：如何评价 XX？从架构角度分析
      2. **技术对比向**：XX 和 YY 有什么本质区别？
      3. **经验分享向**：使用 XX 半年，分享一些心得
      4. **问题回答向**：针对知乎热门问题提供专业回答

      ### 公众号角度库
      1. **趋势解读向**：从 XX 看 AI 开发工具的下一步
      2. **深度长文向**：XX 架构全景解析（万字长文）
      3. **实践总结向**：我们用 XX 做了 YY，踩了这些坑
      4. **行业盘点向**：2026 年最值得关注的 N 个开源项目

      对每个角度给出：
      - 标题候选（2-3 个）
      - 目标受众
      - 预期互动理由
      - 难度评估（素材充足度）

      输出：{{vault_path}}/{{content_base}}/_分析/{YYYYMMDD}-内容分析.md

    depends_on: [merge-materials]

  # ============================================================
  # Node 5: 生成大纲候选
  # ============================================================
  - id: generate-outlines
    kind: report
    tier: heavy
    spec: |
      基于内容分析，为每个"素材×平台"组合生成 3 个大纲候选。

      每个大纲包含：
      ```markdown
      ---
      platform: {platform}
      source: {素材文件}
      angle: {角度类型}
      target_audience: {目标受众}
      estimated_words: {预计字数}
      status: candidate
      created_at: {timestamp}
      ---

      # 大纲：{标题}

      ## 基本信息
      - 平台：{platform}
      - 角度：{角度类型}
      - 目标受众：{...}
      - 预计字数：{...}

      ## 结构
      1. 开头钩子（痛点/悬念/数据冲击）
      2. 主体内容（3-5 个要点，每个要点有小标题）
      3. 结尾行动号召

      ## 各段落要点
      ### 开头
      - ...

      ### 主体
      #### 要点 1：...
      - 素材支撑：{引用素材文件中的具体内容}
      ...

      ### 结尾
      - ...

      ## 标签/话题候选
      {平台特定的标签格式}

      ## 配图建议
      - 封面图：...
      - 内容图：...
      ```

      输出：
      每个大纲一个文件，写入：
      {{vault_path}}/{{content_base}}/_大纲/{YYYYMMDD}-{HHmmss}-{platform}-{slug}.md

      同时在控制台输出摘要，方便用户在 Web UI 看到候选列表。

    depends_on: [analyze-materials]

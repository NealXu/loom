<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f2e"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgA)"/>
  <!-- warp (vertical threads) -->
  <g stroke="#1e293b" stroke-width="6" stroke-linecap="round">
    <line x1="20" y1="10" x2="20" y2="54"/>
    <line x1="44" y1="10" x2="44" y2="54"/>
  </g>
  <!-- weft (horizontal threads) weaving over/under -->
  <g stroke="#3b82f6" stroke-width="6" stroke-linecap="round">
    <line x1="10" y1="24" x2="54" y2="24"/>
    <line x1="10" y1="40" x2="54" y2="40"/>
  </g>
  <!-- crossing knots (nodes) -->
  <g fill="#93c5fd">
    <circle cx="20" cy="24" r="3.4"/>
    <circle cx="44" cy="40" r="3.4"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f2e"/>
      <stop offset="1" stop-color="#0f1117"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgC)"/>
  <!-- DAG: root node branching into a woven lattice, converging to a result node -->
  <g stroke="#3b82f6" stroke-width="3.4" stroke-linecap="round" fill="none">
    <line x1="16" y1="32" x2="32" y2="16"/>
    <line x1="16" y1="32" x2="32" y2="32"/>
    <line x1="16" y1="32" x2="32" y2="48"/>
    <line x1="32" y1="16" x2="48" y2="32"/>
    <line x1="32" y1="32" x2="48" y2="32"/>
    <line x1="32" y1="48" x2="48" y2="32"/>
  </g>
  <g stroke="#93c5fd" stroke-width="3.4" stroke-linecap="round" fill="none">
    <line x1="32" y1="16" x2="32" y2="48"/>
  </g>
  <g fill="#e2e8f0" stroke="#0f1117" stroke-width="2">
    <circle cx="16" cy="32" r="4.6"/>
    <circle cx="48" cy="32" r="5.4" fill="#3b82f6"/>
  </g>
  <g fill="#93c5fd" stroke="#0f1117" stroke-width="1.6">
    <circle cx="32" cy="16" r="3.8"/>
    <circle cx="32" cy="32" r="3.8"/>
    <circle cx="32" cy="48" r="3.8"/>
  </g>
</svg>

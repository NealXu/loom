# Loom configuration — tier-based runner routing + budget policy.
# Runner selection: a node's `tier` maps to an ordered fallback chain.
# If the primary runner's binary is absent, the next in the chain is tried.
# A genuine task failure (non-zero exit) does NOT trigger fallback.

[routing]
critical = ["cc"]
heavy    = ["codex", "cc"]
tooling  = ["pi", "dsh"]
bulk     = ["dsh", "pi"]

[budget]
# Morning digest flags instances whose cost_usd >= this red line.
red_line_usd = 5.0

[vault]
# When set, each successful node's output is written to
# <path>/<instance_id>/<node_id>.md and registered as an Artifact.
# Leave empty to disable artifact persistence.
# Point this at a personal knowledge vault (e.g. "D:/Vaults/loom") to
# promote outputs outside the project; ./vault_out is the project-local default.
path = "./vault_out"

# Periodic jobs (P2-L). The daemon fires each as a cron event every
# `every_seconds`; the dispatcher targets the named template directly.
# Example — run the handoff-refresh SOP once a day:
# [[schedule.jobs]]
# template = "handoff-refresh"
# every_seconds = 86400
# params = { project_path = "D:/Codes/innovation/loom" }

[web]
# Set auth_token to protect API endpoints with bearer token auth.
# Also configurable via LOOM_AUTH_TOKEN environment variable.
# auth_token = "your-secret-here"

[user]
# Default owner for new instances. Also configurable via LOOM_OWNER env var.
# owner = "me"

# Webhook notifications (P6-D). Fire on instance state transitions
# (succeeded, failed). Uncomment and configure to enable.
# [[notifications.webhooks]]
# url = "https://hooks.slack.com/services/..."
# secret = ""  # optional shared secret for HMAC verification
